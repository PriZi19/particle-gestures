<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VFX Particle Hand Controller</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 0 0 10px cyan; pointer-events: none; }
        #video-preview { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 1px solid #444; border-radius: 8px; transform: scaleX(-1); }
        .hint { font-size: 0.8em; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 id="gesture-display">Initializing Camera...</h2>
        <div class="hint">Pinch: Heart | Peace: Flower | Point: Saturn | Punch: EXPLODE</div>
    </div>
    <video id="webcam" style="display:none" playsinline></video>
    <canvas id="video-preview"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE & RENDERER ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. PARTICLE SYSTEM CONFIG ---
        const particleCount = 8000;
        const geometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        const targetPos = new Float32Array(particleCount * 3);
        const colArray = new Float32Array(particleCount * 3);
        const targetCol = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3).fill(0);

        for(let i=0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 20;
            targetPos[i] = posArray[i];
            targetCol[i] = 1.0; 
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colArray, 3));

        // Using a built-in canvas texture for a glowing "soft circle"
        const createCircleTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        };

        const material = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            map: createCircleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);
        camera.position.z = 25;

        // --- 3. MATH TEMPLATES ---
        const setTarget = (i, x, y, z, r, g, b) => {
            targetPos[i*3]=x; targetPos[i*3+1]=y; targetPos[i*3+2]=z;
            targetCol[i*3]=r; targetCol[i*3+1]=g; targetCol[i*3+2]=b;
        };

        const shapes = {
            cloud: () => { for(let i=0; i<particleCount; i++) setTarget(i, (Math.random()-0.5)*30, (Math.random()-0.5)*20, (Math.random()-0.5)*10, 0.2, 0.5, 1); },
            heart: () => {
                for(let i=0; i<particleCount; i++) {
                    const t = (i/particleCount) * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    setTarget(i, x*0.6, y*0.6, 0, 1, 0.1, 0.2);
                }
            },
            flower: () => {
                for(let i=0; i<particleCount; i++) {
                    const t = (i/particleCount) * Math.PI * 2;
                    const r = 8 * Math.cos(5 * t);
                    setTarget(i, r*Math.cos(t), r*Math.sin(t), Math.sin(t*10), 0.8, 0.2, 1);
                }
            },
            saturn: () => {
                for(let i=0; i<particleCount; i++) {
                    if(i < particleCount*0.3) { // Planet
                        const u = Math.random(), v = Math.random();
                        const theta = 2*Math.PI*u, phi = Math.acos(2*v-1);
                        setTarget(i, 5*Math.sin(phi)*Math.cos(theta), 5*Math.sin(phi)*Math.sin(theta), 5*Math.cos(phi), 1, 0.8, 0.5);
                    } else { // Rings
                        const a = Math.random()*Math.PI*2, d = 7 + Math.random()*4;
                        setTarget(i, Math.cos(a)*d, Math.sin(a)*d*0.2, Math.sin(a)*d, 1, 0.6, 0.1);
                    }
                }
            },
            explode: () => {
                for(let i=0; i<particleCount; i++) {
                    const force = 1.5;
                    velocities[i*3] = (Math.random()-0.5)*force;
                    velocities[i*3+1] = (Math.random()-0.5)*force;
                    velocities[i*3+2] = (Math.random()-0.5)*force;
                    targetCol[i*3]=1; targetCol[i*3+1]=1; targetCol[i*3+2]=1;
                }
            }
        };

        // --- 4. GESTURE RECOGNITION ---
        let lastZ = 0;
        const gestureDisplay = document.getElementById('gesture-display');

        const onResults = (results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                const hand = results.multiHandLandmarks[0];
                const wristZ = hand[0].z;
                
                // Detect Punch (Explosion)
                if (lastZ - wristZ > 0.08) {
                    gestureDisplay.innerText = "🔥 EXPLOSION 🔥";
                    shapes.explode();
                } else {
                    const isIndexUp = hand[8].y < hand[6].y;
                    const isMiddleUp = hand[12].y < hand[10].y;
                    const isPinch = Math.hypot(hand[4].x - hand[20].x, hand[4].y - hand[20].y) < 0.06;

                    if (isPinch) { gestureDisplay.innerText = "❤️ Heart Mode"; shapes.heart(); }
                    else if (isIndexUp && isMiddleUp) { gestureDisplay.innerText = "🌸 Flower Mode"; shapes.flower(); }
                    else if (isIndexUp) { gestureDisplay.innerText = "🪐 Saturn Mode"; shapes.saturn(); }
                    else { gestureDisplay.innerText = "☁️ Cloud Mode"; shapes.cloud(); }
                }
                lastZ = wristZ;
            }
        };

        // --- 5. INITIALIZE TRACKING ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraFeed.start();

        // --- 6. ANIMATION ENGINE ---
        function animate() {
            requestAnimationFrame(animate);
            const pos = geometry.attributes.position.array;
            const col = geometry.attributes.color.array;

            for(let i=0; i < particleCount * 3; i++) {
                // Apply physics
                pos[i] += velocities[i];
                velocities[i] *= 0.92; // Friction

                // Elastic pull to target
                const pull = (targetPos[i] - pos[i]) * 0.08;
                pos[i] += pull;

                // Color transition
                col[i] += (targetCol[i] - col[i]) * 0.1;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            points.rotation.y += 0.003;

            // Subtle Camera Shake on high velocity
            if(Math.abs(velocities[0]) > 0.05) {
                camera.position.x = (Math.random()-0.5)*0.2;
                camera.position.y = (Math.random()-0.5)*0.2;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
